[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sanyi-agent-platform"
version = "0.1.0"
description = "三易引擎数据 Agent 开放平台骨架（令牌 + 因子 + 页面 Agent）"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "jsonschema>=4.20",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "cryptography>=41",
]

[project.scripts]
sanyi-mcp = "app.mcp.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
