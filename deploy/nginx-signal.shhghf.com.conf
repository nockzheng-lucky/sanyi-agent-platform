# 三易引擎 Agent 平台 nginx 配置候选
# 域名：signal.shhghf.com
# 证书路径请按实际证书文件替换；DNS 解析到 101.35.210.32。

server {
    listen 80;
    listen [::]:80;
    server_name signal.shhghf.com;

    # Let's Encrypt HTTP-01 验证目录（如使用其它证书可忽略）
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name signal.shhghf.com;

    ssl_certificate     /etc/nginx/ssl/signal.shhghf.com.pem;
    ssl_certificate_key /etc/nginx/ssl/signal.shhghf.com.key;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / 流式聊天
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }
}
