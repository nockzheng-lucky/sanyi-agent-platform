<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>三易引擎 Agent</title>
  <link rel="stylesheet" href="/chat/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">三易</span>
      <div>
        <h1>三易引擎 Agent</h1>
        <p class="subtitle">数据包装成因子，令牌鉴权，先测通再开放</p>
      </div>
    </div>
    <div class="topnav">
      <a href="/keys">Key 管理</a>
      <a href="/login">登录</a>
      <a href="/register">注册</a>
      <span id="account" class="account"></span>
    </div>
  </header>

  <section id="loginCard" class="login-card hidden">
    <h2>输入你的平台令牌</h2>
    <p class="hint">令牌只发送到本站服务器，保存在 HttpOnly cookie 中；不会留在页面 JS 里。</p>
    <form id="loginForm">
      <input id="tokenInput" type="password" autocomplete="off" placeholder="sk-sanyi-..." required />
      <button type="submit">进入</button>
    </form>
    <p class="hint small">也可以打开 /chat?token=sk-... 自动登录；登录后建议把 URL 里的 token 参数去掉。</p>
  </section>

  <main id="chatCard" class="chat-card hidden">
    <aside class="signal-panel">
      <div class="panel-head">
        <div>
          <h2>实时门信号</h2>
          <p>新出现的信号会自动弹到这里</p>
        </div>
        <span id="signalCount" class="count">0</span>
      </div>
      <div id="signalFeed" class="signal-feed">
        <p id="signalEmpty" class="signal-empty">正在等待新信号…</p>
      </div>
    </aside>

    <section class="chat-main">
      <div id="needKeyBanner" class="need-key-banner hidden">
        还没有可用 Key。请先到 <a href="/keys">Key 管理</a> 申请一个 Key，然后回来使用。
      </div>
      <div id="loadedFactorBar" class="loaded-factor-bar hidden">
        <span class="lf-label">已加载因子</span>
        <div id="loadedFactorChips" class="lf-chips"></div>
        <a class="lf-manage" href="/factors">管理</a>
        <button id="clearLoadedFactors" type="button">清除</button>
      </div>
      <div id="messages" class="messages"></div>
      <form id="chatForm" class="composer">
        <textarea id="chatInput" rows="1" placeholder="输入问题，或点击信号卡片让 Agent 解读"></textarea>
        <button type="submit" id="sendBtn">发送</button>
      </form>
      <p class="disclaimer">因子结果仅供研究观察，不构成投资建议。AI 生成内容可能存在偏差。</p>
    </section>
  </main>

  <script src="/chat/chat.js"></script>
<script src="/chat/sidebar.js"></script>
</body>
</html>
