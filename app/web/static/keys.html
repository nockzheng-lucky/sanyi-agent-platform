<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Key 管理 · 三易引擎</title>
  <link rel="stylesheet" href="/chat/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">三易</span>
      <div><h1>三易引擎 Agent</h1><p class="subtitle">Key 管理</p></div>
    </div>
    <div class="account" id="account"></div>
  </header>
  <main class="keys-card">
    <section class="key-create">
      <h2>申请 Key</h2>
      <form id="keyForm" class="auth-form">
        <input id="keyName" placeholder="名称，例如：自己的Agent" />
        <label class="field-label">有效期</label>
        <select id="expiresDays">
          <option value="">长期有效</option>
          <option value="30">30 天</option>
          <option value="90">90 天</option>
          <option value="365">365 天</option>
        </select>
        <details class="advanced">
          <summary>高级设置：IP 白名单（可选）</summary>
          <p class="field-hint">只允许填写的 IP 地址使用这个 Key。普通用户留空即可；例如：1.2.3.4, 5.6.7.8</p>
          <input id="allowIps" placeholder="留空表示不限制" />
        </details>
        <button type="submit">申请 Key</button>
      </form>
      <p id="newKey" class="new-key hidden"></p>
    </section>
    <section class="key-list">
      <h2>我的 Key</h2>
      <div id="keyList"></div>
      <p class="hint small">Key 明文只显示一次，请立即保存。</p>
    </section>
  </main>
  <script src="/chat/auth.js"></script>
<script src="/chat/sidebar.js"></script>
</body>
</html>
