<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>订阅 · 三易引擎</title>
  <link rel="stylesheet" href="/chat/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">三易</span><div><h1>订阅</h1><p class="subtitle">支付确认 + 权益开启</p></div></div>
    <div class="topnav"><a href="/chat">聊天</a><a href="/keys">Key</a><span id="account" class="account"></span></div>
  </header>
  <main class="auth-card">
    <h2>我的订阅</h2>
    <p id="status" class="hint"></p>

    <h2>礼品卡兑换</h2>
    <form id="giftForm" class="auth-form">
      <input id="giftCode" placeholder="输入礼品卡代码" autocomplete="off" />
      <button type="submit">兑换</button>
    </form>
    <p id="giftError" class="form-error"></p>
    <p class="hint small">当前为 MOCK 测试代码：MOCK30（30天）、MOCK90（90天）、MOCK365（365天）。时长可累加。</p>
  </main>
  <script src="/chat/subscription.js"></script>
<script src="/chat/sidebar.js"></script>
</body>
</html>
