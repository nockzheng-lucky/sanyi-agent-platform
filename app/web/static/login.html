<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 · 三易引擎</title>
  <link rel="stylesheet" href="/chat/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">三易</span>
      <div><h1>三易引擎 Agent</h1><p class="subtitle">登录后使用因子服务</p></div>
    </div>
  </header>
  <section class="auth-card">
    <h2>登录</h2>
    <form id="loginForm" class="auth-form">
      <input id="phone" placeholder="手机号" autocomplete="tel" />
      <input id="password" type="password" placeholder="密码" autocomplete="current-password" />
      <button type="submit">登录</button>
    </form>
    <p id="loginError" class="form-error"></p>
    <p class="hint small">还没有账号？<a href="/register">去注册</a></p>
  </section>
  <script src="/chat/auth.js"></script>
</body>
</html>
